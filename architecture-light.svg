ransform="translate(1030,460.0) scale(1.25)" fill="none" stroke="#0969da" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 5.8L19.7 10l-5.8 1.9L12 17.7L10.1 11.9L4.3 10l5.8-1.2z"/><path d="M19 15v4"/><path d="M17 17h4"/><path d="M5 16v3"/><path d="M3.5 17.5h3"/></g><text x="1074.0" y="471.0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#1f2328">AWS Bedrock</text><text x="1074.0" y="497.0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#59636e">Claude Sonnet · Claude Haiku</text><rect x="1010" y="570" width="380" height="110" rx="10" ry="10" fill="#f6f8fa" stroke="#0969da" stroke-width="2"/><g transform="translate(1030,610.0) scale(1.25)" fill="none" stroke="#0969da" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></g><text x="1074.0" y="621.0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#1f2328">AWS SES</text><text x="1074.0" y="647.0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#59636e">optional · outbound email via msmtp</text><text x="400" y="752" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#59636e">Secrets Manager, Cost Explorer and Bedrock calls are signed with the instance IAM role — no AWS keys on disk.</text><text x="400" y="778" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#59636e">Optional SES uses SMTP credentials for a separate IAM user, kept in Secrets Manager and Terraform state.</text></svg>